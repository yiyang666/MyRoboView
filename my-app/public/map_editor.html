<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>栅格地图编辑器 (PGM)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #2b2b2b;
      color: #ddd;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      padding: 6px 10px;
      background: #383838;
      border-bottom: 1px solid #222;
      user-select: none;
    }

    #toolbar button,
    #toolbar select {
      background: #4a4a4a;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 13px;
    }

    #toolbar button:hover {
      background: #5a5a5a;
    }

    #toolbar button.active {
      background: #0d6efd;
      border-color: #0d6efd;
      color: #fff;
    }

    #toolbar button.primary {
      background: #198754;
      border-color: #198754;
      color: #fff;
    }

    #toolbar button.primary:hover {
      background: #157347;
    }

    #toolbar button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #toolbar label {
      font-size: 13px;
      margin-left: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #toolbar input[type=number] {
      width: 60px;
      background: #222;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px;
      font-size: 13px;
    }

    .sep {
      width: 1px;
      height: 22px;
      background: #555;
      margin: 0 4px;
    }

    .swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 1px solid #888;
      vertical-align: -2px;
      margin-right: 3px;
    }

    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #1e1e1e;
    }

    #canvas {
      position: absolute;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    #statusbar {
      display: flex;
      gap: 18px;
      padding: 4px 12px;
      background: #383838;
      border-top: 1px solid #222;
      font-size: 12px;
      color: #aaa;
    }

    #statusbar span b {
      color: #ddd;
      font-weight: normal;
    }

    #dropHint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 18px;
      pointer-events: none;
    }

    /* 区域列表面板 */
    #zonePanel {
      position: absolute;
      right: 0;
      top: 0;
      width: 230px;
      max-height: 60%;
      background: rgba(40, 40, 40, 0.95);
      border: 1px solid #555;
      border-radius: 0 0 0 6px;
      display: none;
      flex-direction: column;
      font-size: 12px;
      z-index: 10;
    }

    #zonePanel header {
      padding: 6px 10px;
      background: #484848;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #zonePanel header button {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 14px;
    }

    #zoneList {
      overflow-y: auto;
    }

    .zoneItem {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }

    .zoneItem:hover {
      background: #4a4a4a;
    }

    .zoneItem.sel {
      background: #0d6efd33;
      border-left: 3px solid #0d6efd;
    }

    .zoneItem .zsw {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .zoneItem .zname {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .zoneItem button {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 0 2px;
    }

    .zoneItem button:hover {
      color: #ff6b6b;
    }

    .zoneItem input[type=checkbox] {
      accent-color: #0d6efd;
    }
  </style>
</head>

<body>
  <div id="toolbar">
    <!-- 机器端桥接：覆盖落盘当前地图的 map_2d.pgm -->
    <button id="btnSaveServer" class="primary" disabled title="覆盖保存到机器端地图目录">保存地图</button>
    <button id="btnSave" disabled>导出 PGM</button>
    <button id="btnSaveYaml" disabled>导出 YAML</button>
    <div class="sep"></div>
    <button id="btnUndo" disabled>撤销</button>
    <button id="btnRedo" disabled>重做</button>
    <div class="sep"></div>
    <button class="tool active" data-tool="brush">笔刷</button>
    <button class="tool" data-tool="line">直线</button>
    <button class="tool" data-tool="rect">矩形</button>
    <button class="tool" data-tool="fill">填充</button>
    <button class="tool" data-tool="picker">取色</button>
    <div class="sep"></div>
    <button class="valbtn active" data-val="0"><span class="swatch" style="background:#000"></span>障碍</button>
    <button class="valbtn" data-val="254"><span class="swatch" style="background:#fff"></span>空闲</button>
    <button class="valbtn" data-val="205"><span class="swatch" style="background:#7f7f7f"></span>未知</button>
    <div class="sep"></div>
    <label>笔刷 <input type="number" id="brushSize" value="3" min="1" max="100"></label>
    <div class="sep"></div>
    <button id="btnTris">三态化</button>
    <button id="btnFit">适配窗口</button>
    <label><input type="checkbox" id="showGrid"> 网格</label>
    <div class="sep"></div>
    <button class="tool" data-tool="zrect">区域·矩形</button>
    <button class="tool" data-tool="zpoly">区域·多边形</button>
    <button class="tool" data-tool="zselect">区域·选择</button>
    <select id="zoneType"></select>
    <button id="btnZones">区域列表</button>
    <button id="btnExportZones" disabled>导出区域</button>
  </div>
  <div id="viewport">
    <canvas id="canvas"></canvas>
    <div id="zonePanel">
      <header>语义区域 <button id="btnClosePanel">×</button></header>
      <div id="zoneList"></div>
    </div>
    <div id="dropHint">正在从机器端加载地图…<br><span style="font-size:13px">ROS map_server 约定：0=障碍(黑) 205=未知(灰)
        254=空闲(白)</span></div>
  </div>
  <div id="statusbar">
    <span>地图 <b id="stMapId">-</b></span>
    <span>尺寸 <b id="stSize">-</b></span>
    <span>栅格 <b id="stCell">-</b></span>
    <span>物理坐标 <b id="stPhys">-</b></span>
    <span>像素值 <b id="stVal">-</b></span>
    <span>缩放 <b id="stZoom">-</b></span>
    <span>分辨率 <b id="stRes">-</b></span>
    <span>原点 <b id="stOrigin">-</b></span>
  </div>

  <script>
    "use strict";
    // ===================== 数据模型 =====================
    // 像素值遵循 ROS map_server 约定: 0=障碍(黑), 254=空闲(白), 205=未知(灰), 其余灰度过渡
    let W = 0, H = 0;                 // 地图宽高(栅格)
    let pix = null;                   // Uint8Array 像素数据, 行优先, 第0行=图像顶行(PGM 约定)
    let resolution = 0.05;            // m/格 (来自 yaml, 仅用于物理坐标显示)
    let origin = [0, 0, 0];           // yaml origin [x,y,yaw], 图像左下角对应的世界坐标
    let fileName = "map";
    // 机器端桥接参数（由 URL 注入；须在 loadPgmBuffer 调用前就绪）
    let bridgeMapId = "";
    let bridgeToken = "";

    // ===================== 视图状态 =====================
    const vp = document.getElementById("viewport");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let scale = 4;                    // 屏幕像素/栅格
    let viewX = 0, viewY = 0;         // 地图(0,0)栅格在视口中的屏幕坐标
    let offCanvas = null, offCtx = null;   // 离屏 1:1 画布, 编辑即更新, 显示时缩放绘制
    let showGrid = false;

    // ===================== 编辑状态 =====================
    let tool = "brush";
    let paintVal = 0;
    let brushSize = 3;
    let drawing = false;
    let strokeBefore = null;          // 一笔开始前的快照(撤销粒度=一笔)
    let lineStart = null;             // 直线/矩形起点 {x,y}
    let hoverCell = null;
    const undoStack = [], redoStack = [];
    const UNDO_MAX = 40;

    // ===================== 语义区域层 =====================
    // 区域叠加在地图之上, 不改像素; 栅格坐标系, 多边形=顶点数组, 矩形=两点
    const ZONE_TYPES = {
      keepout: { name: "禁行区", color: "#e74c3c" },
      slowdown: { name: "减速区", color: "#f39c12" },
      speed_limit: { name: "限速区", color: "#f1c40f" },
      preferred: { name: "优先通道", color: "#2ecc71" },
      custom: { name: "自定义", color: "#9b59b6" },
    };
    let zones = [];            // {id, type, shape:'rect'|'poly', pts:[[x,y]...], angle(仅rect,rad), name, visible}
    let zoneSeq = 1;
    let selZoneId = null;
    let polyDraft = [];        // 多边形绘制中的顶点
    let rotateHandle = null;   // 区域旋转拖拽 {zoneId, cx, cy, startAngle, grabOffset}
    let resizeHandle = null;   // 区域缩放拖拽 {zoneId, kind:'corner'|'vertex', idx, cx, cy, origPts, origAngle}
    let moveZone = null;       // 区域整体移动 {zoneId, grabDx, grabDy}
    const zoneTypeSel = document.getElementById("zoneType");
    for (const [k, v] of Object.entries(ZONE_TYPES)) {
      const o = document.createElement("option");
      o.value = k; o.textContent = v.name;
      zoneTypeSel.appendChild(o);
    }

    // ===================== PGM 解析/序列化 =====================
    function parsePGM(buf) {
      const dv = new DataView(buf);
      let pos = 0;
      const readToken = () => {
        // 跳过空白与注释
        while (pos < buf.byteLength) {
          const c = dv.getUint8(pos);
          if (c === 0x23) { while (pos < buf.byteLength && dv.getUint8(pos) !== 0x0A) pos++; }
          else if (c === 0x20 || c === 0x09 || c === 0x0A || c === 0x0D) pos++;
          else break;
        }
        let s = "";
        while (pos < buf.byteLength) {
          const c = dv.getUint8(pos);
          if (c === 0x20 || c === 0x09 || c === 0x0A || c === 0x0D || c === 0x23) break;
          s += String.fromCharCode(c); pos++;
        }
        return s;
      };
      const magic = readToken();
      const w = parseInt(readToken()), h = parseInt(readToken());
      const maxval = parseInt(readToken());
      pos++; // 单个空白字符
      if (w <= 0 || h <= 0 || maxval <= 0) throw new Error("PGM 头解析失败");
      const out = new Uint8Array(w * h);
      if (magic === "P5") {
        if (maxval < 256) {
          if (pos + w * h > buf.byteLength) throw new Error("PGM 数据长度不足");
          const src = new Uint8Array(buf, pos, w * h);
          if (maxval === 255) out.set(src);
          else for (let i = 0; i < out.length; i++) out[i] = Math.round(src[i] * 255 / maxval);
        } else {
          for (let i = 0; i < w * h; i++)
            out[i] = Math.round(dv.getUint16(pos + i * 2) * 255 / maxval);
        }
      } else if (magic === "P2") {
        const text = new TextDecoder().decode(new Uint8Array(buf, pos));
        const nums = text.split(/\s+/).filter(s => s.length).map(Number);
        for (let i = 0; i < w * h; i++) out[i] = Math.round((nums[i] || 0) * 255 / maxval);
      } else throw new Error("不支持的格式: " + magic + " (仅支持 P5/P2 PGM)");
      return { w, h, data: out };
    }

    function serializePGM() {
      const header = `P5\n# CREATOR: map_editor ${W}x${H}\n${W} ${H}\n255\n`;
      const hb = new TextEncoder().encode(header);
      const out = new Uint8Array(hb.length + W * H);
      out.set(hb, 0); out.set(pix, hb.length);
      return out;
    }

    // ===================== YAML 解析/生成 =====================
    function parseYamlMeta(text) {
      const grab = (key) => {
        const m = text.match(new RegExp("^\\s*" + key + "\\s*:\\s*(.+)$", "m"));
        return m ? m[1].trim() : null;
      };
      const res = parseFloat(grab("resolution"));
      if (isFinite(res)) resolution = res;
      const om = grab("origin");
      if (om) {
        const nums = om.replace(/[\[\]]/g, "").split(",").map(Number);
        if (nums.length >= 2 && nums.every(isFinite)) origin = [nums[0], nums[1], nums[2] || 0];
      }
      updateStatus();
    }

    function serializeYaml() {
      return `image: ${fileName}.pgm\nresolution: ${resolution}\n` +
        `origin: [${origin[0]}, ${origin[1]}, ${origin[2]}]\n` +
        `negate: 0\noccupied_thresh: 0.65\nfree_thresh: 0.196\n`;
    }

    // ===================== 渲染 =====================
    // 三态高亮着色: 障碍黑 / 空闲白 / 未知灰 / 过渡值按 ROS 阈值归类着色提示
    function colorOf(v) {
      if (v === 205) return [127, 127, 127];
      if (v <= 89) return [0, 0, 0];          // < occupied_thresh(0.65*255≈166) 之间按灰度
      if (v >= 196) return [255, 255, 255];
      return [Math.min(255, v + 40), v, v];    // 过渡区轻微偏红提示"非标准三态值"
    }

    function rebuildOffscreen() {
      offCanvas = document.createElement("canvas");
      offCanvas.width = W; offCanvas.height = H;
      offCtx = offCanvas.getContext("2d");
      const img = offCtx.createImageData(W, H);
      for (let i = 0; i < W * H; i++) {
        const [r, g, b] = colorOf(pix[i]);
        img.data[i * 4] = r; img.data[i * 4 + 1] = g;
        img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = 255;
      }
      offCtx.putImageData(img, 0, 0);
    }

    // 只更新改动的格子(笔刷频繁调用, 避免整帧重画)
    function updateOffscreenCell(x, y) {
      const v = pix[y * W + x];
      const [r, g, b] = colorOf(v);
      offCtx.fillStyle = `rgb(${r},${g},${b})`;
      offCtx.fillRect(x, y, 1, 1);
    }

    function render(previewLine) {
      canvas.width = vp.clientWidth; canvas.height = vp.clientHeight;
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!pix) return;
      ctx.drawImage(offCanvas, 0, 0, W, H, viewX, viewY, W * scale, H * scale);

      // 栅格线(缩放到足够大时显示)
      if (showGrid && scale >= 8) {
        ctx.strokeStyle = "rgba(255,255,255,0.12)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= W; x++) { ctx.moveTo(viewX + x * scale + .5, viewY); ctx.lineTo(viewX + x * scale + .5, viewY + H * scale); }
        for (let y = 0; y <= H; y++) { ctx.moveTo(viewX, viewY + y * scale + .5); ctx.lineTo(viewX + W * scale, viewY + y * scale + .5); }
        ctx.stroke();
      }

      // 直线/矩形预览
      if (previewLine && lineStart) {
        ctx.strokeStyle = "rgba(13,110,253,0.9)";
        ctx.lineWidth = Math.max(1, brushSize * scale * 0.15);
        ctx.setLineDash([6, 4]);
        const a = cellToScreen(lineStart.x, lineStart.y);
        const b = cellToScreen(previewLine.x, previewLine.y);
        if (tool === "line") { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
        else if (tool === "rect" || tool === "zrect") ctx.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(a.x - b.x), Math.abs(a.y - b.y));
        ctx.setLineDash([]);
      }

      // ---- 语义区域层 ----
      for (const z of zones) {
        if (!z.visible) continue;
        const c = ZONE_TYPES[z.type].color;
        const isSel = z.id === selZoneId;
        ctx.strokeStyle = c;
        ctx.fillStyle = c + (isSel ? "55" : "33");   // 半透明填充, 选中更浓
        ctx.lineWidth = isSel ? 3 : 1.5;
        ctx.beginPath();
        const pts = zoneDrawPts(z);
        pts.forEach((p, i) => { const s = cellToScreen(p[0], p[1]); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // 类型缩写标签
        if (isSel && pts.length) {
          const s0 = cellToScreen(pts[0][0], pts[0][1]);
          ctx.fillStyle = c;
          ctx.font = "12px sans-serif";
          const angTxt = z.shape === "rect" && z.angle ? ` (${(z.angle * 57.2958).toFixed(1)}°)` : "";
          ctx.fillText(z.name + angTxt, s0.x + 4, s0.y - 6);
        }
        // 选中矩形: 画旋转手柄(中心连线 + 端点圆点)
        if (isSel && z.shape === "rect") {
          const [cx, cy] = zoneRectCenter(z);
          const [hx, hy] = zoneRotateHandleCell(z);
          const cs = cellToScreen(cx, cy), hs = cellToScreen(hx, hy);
          ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 3]);
          ctx.beginPath(); ctx.moveTo(cs.x, cs.y); ctx.lineTo(hs.x, hs.y); ctx.stroke();
          ctx.setLineDash([]);
          ctx.beginPath(); ctx.arc(hs.x, hs.y, 6, 0, 2 * Math.PI); ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.font = "bold 10px sans-serif";
          ctx.fillText("↻", hs.x - 4, hs.y + 3.5);
        }
        // 选中区域: 画缩放手柄(矩形角点 / 多边形顶点, 白色方块)
        if (isSel) {
          const handles = z.shape === "rect" ? zoneResizeHandles(z) : z.pts;
          ctx.fillStyle = "#fff";
          ctx.strokeStyle = c;
          ctx.lineWidth = 1.5;
          for (const [hx, hy] of handles) {
            const hs = cellToScreen(hx, hy);
            ctx.fillRect(hs.x - 4, hs.y - 4, 8, 8);
            ctx.strokeRect(hs.x - 4, hs.y - 4, 8, 8);
          }
        }
      }
      // 多边形绘制草稿
      if (tool === "zpoly" && polyDraft.length) {
        const c = ZONE_TYPES[zoneTypeSel.value].color;
        ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 2;
        ctx.beginPath();
        polyDraft.forEach((p, i) => { const s = cellToScreen(p[0], p[1]); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
        if (hoverCell) { const s = cellToScreen(hoverCell.x, hoverCell.y); ctx.lineTo(s.x, s.y); }
        ctx.stroke();
        polyDraft.forEach(p => { const s = cellToScreen(p[0], p[1]); ctx.fillRect(s.x - 3, s.y - 3, 6, 6); });
        if (polyDraft.length >= 3) {
          const s0 = cellToScreen(polyDraft[0][0], polyDraft[0][1]);
          ctx.font = "12px sans-serif";
          ctx.fillText("双击完成 / Esc 取消", s0.x + 6, s0.y - 8);
        }
      }
      updateStatus();
    }

    // 区域轮廓点(矩形按 angle 绕中心旋转展开为4顶点)
    function zoneDrawPts(z) {
      if (z.shape === "poly") return z.pts;
      const [x0, y0] = z.pts[0], [x1, y1] = z.pts[1];
      if (!z.angle) return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      const hw = Math.abs(x1 - x0) / 2, hh = Math.abs(y1 - y0) / 2;
      const cos = Math.cos(z.angle), sin = Math.sin(z.angle);
      return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]]
        .map(([dx, dy]) => [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos]);
    }

    // 矩形中心与旋转手柄位置(手柄在中心正上方 hh+20 栅格处, 随 angle 旋转)
    function zoneRectCenter(z) {
      return [(z.pts[0][0] + z.pts[1][0]) / 2, (z.pts[0][1] + z.pts[1][1]) / 2];
    }
    function zoneRotateHandleCell(z) {
      const [cx, cy] = zoneRectCenter(z);
      const hh = Math.abs(z.pts[1][1] - z.pts[0][1]) / 2;
      const d = hh + Math.max(6, 30 / scale);   // 手柄距中心(栅格)
      const a = (z.angle || 0) - Math.PI / 2;   // 未旋转时手柄在正上方
      return [cx + d * Math.cos(a), cy + d * Math.sin(a)];
    }

    // 点在多边形内(射线法), 用于区域拾取; pts 为 zoneDrawPts 输出
    function pointInPoly(px, py, pts) {
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, yi] = pts[i], [xj, yj] = pts[j];
        if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi)
          inside = !inside;
      }
      return inside;
    }

    // 矩形缩放手柄: 返回4角点(栅格坐标, 已含旋转)
    function zoneResizeHandles(z) {
      return zoneDrawPts(z);   // 矩形的4个角即缩放手柄
    }

    function cellToScreen(cx, cy) { return { x: viewX + (cx + 0.5) * scale, y: viewY + (cy + 0.5) * scale }; }
    function screenToCell(sx, sy) {
      return { x: Math.floor((sx - viewX) / scale), y: Math.floor((sy - viewY) / scale) };
    }

    function fitView() {
      if (!pix) return;
      scale = Math.max(0.5, Math.min(vp.clientWidth / W, vp.clientHeight / H) * 0.95);
      viewX = (vp.clientWidth - W * scale) / 2;
      viewY = (vp.clientHeight - H * scale) / 2;
      render();
    }

    // ===================== 编辑操作 =====================
    function setCell(x, y, v) {
      if (x < 0 || y < 0 || x >= W || y >= H) return;
      const i = y * W + x;
      if (pix[i] === v) return;
      pix[i] = v;
      updateOffscreenCell(x, y);
    }

    function stampBrush(cx, cy, v) {
      const r = brushSize / 2;
      const x0 = Math.floor(cx - r), x1 = Math.ceil(cx + r);
      const y0 = Math.floor(cy - r), y1 = Math.ceil(cy + r);
      for (let y = y0; y <= y1; y++)
        for (let x = x0; x <= x1; x++)
          if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= r * r) setCell(x, y, v);
    }

    // 两点间插值盖章(拖动时连续)
    function brushLine(x0, y0, x1, y1, v) {
      const d = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
      for (let i = 0; i <= d; i++)
        stampBrush(x0 + (x1 - x0) * i / d, y0 + (y1 - y0) * i / d, v);
    }

    function fillRect(x0, y0, x1, y1, v) {
      const [xa, xb] = [Math.min(x0, x1), Math.max(x0, x1)];
      const [ya, yb] = [Math.min(y0, y1), Math.max(y0, y1)];
      for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) setCell(x, y, v);
    }

    // 扫描线洪泛填充(以目标格原值为基准)
    function floodFill(sx, sy, v) {
      const target = pix[sy * W + sx];
      if (target === v) return;
      const stack = [[sx, sy]];
      while (stack.length) {
        let [x, y] = stack.pop();
        while (x >= 0 && pix[y * W + x] === target) x--;
        x++;
        let up = false, down = false;
        while (x < W && pix[y * W + x] === target) {
          setCell(x, y, v);
          if (y > 0) {
            const m = pix[(y - 1) * W + x] === target;
            if (m && !up) { stack.push([x, y - 1]); up = true; } else if (!m) up = false;
          }
          if (y < H - 1) {
            const m = pix[(y + 1) * W + x] === target;
            if (m && !down) { stack.push([x, y + 1]); down = true; } else if (!m) down = false;
          }
          x++;
        }
      }
    }

    // 三态化: 按 ROS 阈值把灰度图压成 0/205/254
    function trisState() {
      if (!pix) return;
      pushUndo();
      for (let i = 0; i < pix.length; i++) {
        const v = pix[i];
        if (v === 205) continue;
        if (v > 196) pix[i] = 254; else if (v < 196) pix[i] = 0;
      }
      rebuildOffscreen(); render();
    }

    // ===================== 撤销/重做 =====================
    function pushUndo(snapshot) {
      undoStack.push(snapshot || pix.slice());
      if (undoStack.length > UNDO_MAX) undoStack.shift();
      redoStack.length = 0;
      syncUndoBtns();
    }
    function undo() {
      if (!undoStack.length) return;
      redoStack.push(pix.slice());
      pix = undoStack.pop();
      rebuildOffscreen(); render(); syncUndoBtns();
    }
    function redo() {
      if (!redoStack.length) return;
      undoStack.push(pix.slice());
      pix = redoStack.pop();
      rebuildOffscreen(); render(); syncUndoBtns();
    }
    function syncUndoBtns() {
      document.getElementById("btnUndo").disabled = !undoStack.length;
      document.getElementById("btnRedo").disabled = !redoStack.length;
    }

    // ===================== 区域管理 =====================
    function addZone(shape, pts) {
      const type = zoneTypeSel.value;
      const z = {
        id: zoneSeq, type, shape, pts: pts.map(p => [...p]),
        name: ZONE_TYPES[type].name + "_" + zoneSeq, visible: true
      };
      zoneSeq++;
      zones.push(z);
      selZoneId = z.id;
      refreshZonePanel();
      document.getElementById("btnExportZones").disabled = false;
    }

    function deleteZone(id) {
      zones = zones.filter(z => z.id !== id);
      if (selZoneId === id) selZoneId = null;
      refreshZonePanel();
      document.getElementById("btnExportZones").disabled = !zones.length;
      render();
    }

    function refreshZonePanel() {
      const list = document.getElementById("zoneList");
      list.innerHTML = "";
      for (const z of zones) {
        const item = document.createElement("div");
        item.className = "zoneItem" + (z.id === selZoneId ? " sel" : "");
        // 可见性
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = z.visible;
        cb.onclick = e => { e.stopPropagation(); z.visible = cb.checked; render(); };
        // 色块
        const sw = document.createElement("span");
        sw.className = "zsw"; sw.style.background = ZONE_TYPES[z.type].color;
        // 名称(双击重命名)
        const nm = document.createElement("span");
        nm.className = "zname"; nm.textContent = z.name; nm.title = "双击重命名";
        nm.ondblclick = e => {
          e.stopPropagation();
          const v = prompt("区域名称:", z.name);
          if (v) { z.name = v; refreshZonePanel(); render(); }
        };
        // 删除
        const del = document.createElement("button");
        del.textContent = "✕"; del.title = "删除";
        del.onclick = e => { e.stopPropagation(); deleteZone(z.id); };
        item.append(cb, sw, nm, del);
        item.onclick = () => { selZoneId = z.id; refreshZonePanel(); render(); };
        list.appendChild(item);
      }
    }

    document.getElementById("btnZones").onclick = () => {
      const p = document.getElementById("zonePanel");
      p.style.display = p.style.display === "flex" ? "none" : "flex";
      refreshZonePanel();
    };
    document.getElementById("btnClosePanel").onclick = () =>
      document.getElementById("zonePanel").style.display = "none";

    // ---- 区域光栅化: 扫描线奇偶填充, 返回 Uint8Array(0/100) ----
    function rasterizeZones(filter) {
      const mask = new Uint8Array(W * H);
      for (const z of zones) {
        if (!z.visible) continue;
        if (filter && !filter(z)) continue;
        const pts = zoneDrawPts(z);
        if (pts.length < 3) continue;
        const ys = pts.map(p => p[1]);
        const yMin = Math.max(0, Math.floor(Math.min(...ys)));
        const yMax = Math.min(H - 1, Math.ceil(Math.max(...ys)));
        for (let y = yMin; y <= yMax; y++) {
          const cy = y + 0.5;
          const xs = [];
          for (let i = 0; i < pts.length; i++) {
            const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
            if ((ay <= cy) !== (by <= cy)) xs.push(ax + (cy - ay) / (by - ay) * (bx - ax));
          }
          xs.sort((a, b) => a - b);
          for (let k = 0; k + 1 < xs.length; k += 2) {
            const xa = Math.max(0, Math.ceil(xs[k] - 0.5));
            const xb = Math.min(W - 1, Math.floor(xs[k + 1] - 0.5));
            for (let x = xa; x <= xb; x++) mask[y * W + x] = 100;
          }
        }
      }
      return mask;
    }

    // ---- 导出: keepout mask (nav2 KeepoutFilter 兼容) + zones.yaml 矢量描述 ----
    document.getElementById("btnExportZones").onclick = () => {
      if (!zones.length) return;
      // keepout mask: 仅禁行区(其余类型只进 yaml, 由导航侧自行解释)
      const mask = rasterizeZones(z => z.type === "keepout");
      if (mask.some(v => v)) {
        const header = `P5\n# CREATOR: map_editor keepout_mask ${W}x${H}\n${W} ${H}\n255\n`;
        const hb = new TextEncoder().encode(header);
        const out = new Uint8Array(hb.length + W * H);
        out.set(hb, 0);
        for (let i = 0; i < W * H; i++) out[hb.length + i] = mask[i] ? 100 : 0;
        download(new Blob([out], { type: "image/x-portable-graymap" }), fileName + "_keepout.pgm");
        const yml = `image: ${fileName}_keepout.pgm\nresolution: ${resolution}\n` +
          `origin: [${origin[0]}, ${origin[1]}, ${origin[2]}]\nnegate: 0\noccupied_thresh: 0.65\nfree_thresh: 0.196\nmode: trinary\n`;
        download(new Blob([yml], { type: "text/yaml" }), fileName + "_keepout.yaml");
      }
      // zones.yaml: 全部区域的矢量描述(物理坐标, ROS 左下角原点)
      const lines = ["zones:"];
      for (const z of zones) {
        lines.push(`  - name: "${z.name}"`, `    type: ${z.type}`);
        if (z.shape === "rect" && z.angle)
          lines.push(`    angle_deg: ${(z.angle * 57.29577951308232).toFixed(2)}`);
        const pts = zoneDrawPts(z).map(([cx, cy]) =>
          `[${(origin[0] + cx * resolution).toFixed(3)}, ${(origin[1] + (H - 1 - cy) * resolution).toFixed(3)}]`);
        lines.push(`    polygon: [${pts.join(", ")}]`);
      }
      download(new Blob([lines.join("\n") + "\n"], { type: "text/yaml" }), fileName + "_zones.yaml");
    };

    // ===================== 鼠标交互 =====================
    let panning = false, panStart = null, lastCell = null;

    canvas.addEventListener("mousedown", e => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      if (e.button === 1 || e.button === 2 || (e.button === 0 && e.shiftKey)) {  // 中/右键或Shift+左键=平移
        panning = true; panStart = { sx, sy, viewX, viewY }; return;
      }
      if (!pix || e.button !== 0) return;
      const c = screenToCell(sx, sy);

      // ---- 选择工具: 手柄命中 > 区域拾取 > 空白取消选中 ----
      if (tool === "zselect") {
        // 1) 已选中区域的手柄命中(屏幕距离)
        if (selZoneId != null) {
          const z = zones.find(z => z.id === selZoneId);
          if (z) {
            // 旋转手柄(仅矩形)
            if (z.shape === "rect") {
              const [hx, hy] = zoneRotateHandleCell(z);
              const hs = cellToScreen(hx, hy);
              if (Math.hypot(sx - hs.x, sy - hs.y) <= 10) {
                const [cx, cy] = zoneRectCenter(z);
                rotateHandle = {
                  zoneId: z.id, cx, cy,
                  startAngle: z.angle || 0,
                  grabOffset: Math.atan2(c.y - cy, c.x - cx) - (z.angle || 0)
                };
                return;
              }
            }
            // 缩放手柄(矩形角点 / 多边形顶点)
            const handles = z.shape === "rect" ? zoneResizeHandles(z) : z.pts;
            for (let i = 0; i < handles.length; i++) {
              const hs = cellToScreen(handles[i][0], handles[i][1]);
              if (Math.hypot(sx - hs.x, sy - hs.y) <= 8) {
                const [cx, cy] = z.shape === "rect" ? zoneRectCenter(z)
                  : [z.pts.reduce((s, p) => s + p[0], 0) / z.pts.length,
                  z.pts.reduce((s, p) => s + p[1], 0) / z.pts.length];
                resizeHandle = {
                  zoneId: z.id, idx: i, cx, cy,
                  kind: z.shape === "rect" ? "corner" : "vertex",
                  origPts: z.pts.map(p => [...p]), origAngle: z.angle || 0
                };
                return;
              }
            }
          }
        }
        // 2) 区域拾取(后画的在上层, 倒序找第一个命中的)
        for (let i = zones.length - 1; i >= 0; i--) {
          const z = zones[i];
          if (!z.visible) continue;
          if (pointInPoly(c.x, c.y, zoneDrawPts(z))) {
            selZoneId = z.id;
            refreshZonePanel();
            // 直接抓起移动: 记录鼠标与区域中心的偏移
            const [cx, cy] = z.shape === "rect" ? zoneRectCenter(z)
              : [z.pts.reduce((s, p) => s + p[0], 0) / z.pts.length,
              z.pts.reduce((s, p) => s + p[1], 0) / z.pts.length];
            moveZone = { zoneId: z.id, grabDx: c.x - cx, grabDy: c.y - cy };
            render();
            return;
          }
        }
        // 3) 空白处: 取消选中
        selZoneId = null;
        refreshZonePanel();
        render();
        return;
      }

      // 选中矩形的旋转手柄命中(其他工具下也可旋转, 屏幕距离判定)
      if (selZoneId != null) {
        const z = zones.find(z => z.id === selZoneId);
        if (z && z.shape === "rect") {
          const [hx, hy] = zoneRotateHandleCell(z);
          const hs = cellToScreen(hx, hy);
          if (Math.hypot(sx - hs.x, sy - hs.y) <= 10) {
            const [cx, cy] = zoneRectCenter(z);
            rotateHandle = {
              zoneId: z.id, cx, cy,
              startAngle: z.angle || 0,
              grabOffset: Math.atan2(c.y - cy, c.x - cx) - (z.angle || 0)
            };
            return;
          }
        }
      }

      if (c.x < 0 || c.y < 0 || c.x >= W || c.y >= H) return;

      // 区域多边形: 逐点点击, 双击完成
      if (tool === "zpoly") { polyDraft.push([c.x, c.y]); render(); return; }

      if (tool === "picker") {
        paintVal = pix[c.y * W + c.x];
        document.querySelectorAll(".valbtn").forEach(b =>
          b.classList.toggle("active", +b.dataset.val === paintVal));
        return;
      }
      drawing = true;
      strokeBefore = pix.slice();
      if (tool === "brush") { stampBrush(c.x, c.y, paintVal); lastCell = c; }
      else if (tool === "fill") { floodFill(c.x, c.y, paintVal); endStroke(); }
      else lineStart = c;   // line / rect / zrect 等 mouseup 落笔
      render();
    });

    // 双击: 多边形区域闭合
    canvas.addEventListener("dblclick", e => {
      if (tool === "zpoly" && polyDraft.length >= 3) {
        addZone("poly", polyDraft);
        polyDraft = [];
        render();
      }
    });

    canvas.addEventListener("mousemove", e => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      if (panning) { viewX = panStart.viewX + sx - panStart.sx; viewY = panStart.viewY + sy - panStart.sy; render(); return; }
      // 旋转手柄拖拽: 以矩形中心为轴, 鼠标方向角减抓取偏移即新角度(Shift 吸附 15°)
      if (rotateHandle) {
        const z = zones.find(z => z.id === rotateHandle.zoneId);
        if (z) {
          const c = screenToCell(sx, sy);
          let a = Math.atan2(c.y - rotateHandle.cy, c.x - rotateHandle.cx) - rotateHandle.grabOffset;
          if (e.shiftKey) a = Math.round(a / (Math.PI / 12)) * (Math.PI / 12);
          z.angle = a;
          render();
        }
        return;
      }
      // 缩放手柄拖拽
      if (resizeHandle) {
        const z = zones.find(z => z.id === resizeHandle.zoneId);
        if (z) {
          const c = screenToCell(sx, sy);
          if (resizeHandle.kind === "vertex") {
            // 多边形: 直接移动该顶点
            z.pts[resizeHandle.idx] = [c.x, c.y];
          } else {
            // 矩形角点: 以对角为锚, 在矩形局部系(反旋转)中重算宽高
            const corners = zoneDrawPts({ shape: "rect", pts: resizeHandle.origPts, angle: resizeHandle.origAngle });
            const [ax, ay] = corners[(resizeHandle.idx + 2) % 4];   // 对角(固定锚点)
            const ang = resizeHandle.origAngle;
            const cos = Math.cos(-ang), sin = Math.sin(-ang);
            // 把锚点和新角点都反旋转到局部系(以锚点为原点)
            const lx = (c.x - ax) * cos - (c.y - ay) * sin;
            const ly = (c.x - ax) * sin + (c.y - ay) * cos;
            // 局部系下新矩形的两角: (0,0) 与 (lx,ly) -> 还原为存储的轴对齐两角(相对中心)
            const cx = resizeHandle.cx, cy = resizeHandle.cy;
            const c2 = Math.cos(ang), s2 = Math.sin(ang);
            // 局部系四角(锚点为原点), 中心在 (lx/2, ly/2); 转回世界系
            const ncx = ax + (lx / 2) * c2 - (ly / 2) * s2;
            const ncy = ay + (lx / 2) * s2 + (ly / 2) * c2;
            const hw = Math.abs(lx) / 2, hh = Math.abs(ly) / 2;
            if (hw > 0.5 && hh > 0.5) {   // 最小尺寸约束(栅格)
              z.pts = [[ncx - hw, ncy - hh], [ncx + hw, ncy + hh]];
              z.angle = ang;
            }
          }
          render();
        }
        return;
      }
      // 区域整体移动
      if (moveZone) {
        const z = zones.find(z => z.id === moveZone.zoneId);
        if (z) {
          const c = screenToCell(sx, sy);
          const ncx = c.x - moveZone.grabDx, ncy = c.y - moveZone.grabDy;
          const [ocx, ocy] = z.shape === "rect" ? zoneRectCenter(z)
            : [z.pts.reduce((s, p) => s + p[0], 0) / z.pts.length,
            z.pts.reduce((s, p) => s + p[1], 0) / z.pts.length];
          const dx = ncx - ocx, dy = ncy - ocy;
          z.pts = z.pts.map(([px, py]) => [px + dx, py + dy]);
          render();
        }
        return;
      }
      if (!pix) return;
      hoverCell = screenToCell(sx, sy);
      if (drawing && tool === "brush" && lastCell) {
        brushLine(lastCell.x, lastCell.y, hoverCell.x, hoverCell.y, paintVal);
        lastCell = hoverCell;
      }
      render(drawing ? hoverCell : null);
    });

    window.addEventListener("mouseup", () => {
      if (rotateHandle) {
        // 角度归一化到 [0, 180°) —— 矩形旋转 180° 与 0° 等价
        const z = zones.find(z => z.id === rotateHandle.zoneId);
        if (z) {
          let a = (z.angle || 0) % Math.PI;
          if (a < 0) a += Math.PI;
          if (Math.abs(a) < 1e-9) a = 0;
          z.angle = a;
        }
        rotateHandle = null;
        render();
        return;
      }
      if (resizeHandle) { resizeHandle = null; render(); return; }
      if (moveZone) { moveZone = null; render(); return; }
      if (panning) { panning = false; return; }
      if (!drawing) return;
      if ((tool === "line" || tool === "rect" || tool === "zrect") && lineStart && hoverCell) {
        if (tool === "line") brushLine(lineStart.x, lineStart.y, hoverCell.x, hoverCell.y, paintVal);
        else if (tool === "rect") fillRect(lineStart.x, lineStart.y, hoverCell.x, hoverCell.y, paintVal);
        else if (tool === "zrect") addZone("rect", [[lineStart.x, lineStart.y], [hoverCell.x, hoverCell.y]]);
      }
      if (tool === "zrect") { drawing = false; lineStart = null; strokeBefore = null; render(); return; }
      endStroke();
      render();
    });

    function endStroke() {
      if (strokeBefore) pushUndo(strokeBefore);
      strokeBefore = null; drawing = false; lineStart = null;
    }

    canvas.addEventListener("wheel", e => {
      if (!pix) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      const f = e.deltaY < 0 ? 1.2 : 1 / 1.2;
      const ns = Math.min(100, Math.max(0.2, scale * f));
      viewX = sx - (sx - viewX) * (ns / scale);
      viewY = sy - (sy - viewY) * (ns / scale);
      scale = ns;
      render();
    }, { passive: false });

    canvas.addEventListener("contextmenu", e => e.preventDefault());
    window.addEventListener("resize", () => render());

    // ===================== 文件载入 =====================
    function loadPgmBuffer(buf, name) {
      try {
        const p = parsePGM(buf);
        W = p.w; H = p.h; pix = p.data;
        fileName = name.replace(/\.pgm$/i, "");
        undoStack.length = redoStack.length = 0;
        zones = []; zoneSeq = 1; selZoneId = null; polyDraft = [];
        document.getElementById("btnExportZones").disabled = true;
        refreshZonePanel();
        document.getElementById("dropHint").style.display = "none";
        document.getElementById("btnSave").disabled = false;
        document.getElementById("btnSaveYaml").disabled = false;
        // 仅在已接入机器端 map_id 时允许覆盖落盘
        document.getElementById("btnSaveServer").disabled = !bridgeMapId;
        rebuildOffscreen(); fitView(); syncUndoBtns();
      } catch (err) { alert("PGM 载入失败: " + err.message); }
    }

    // ===================== 机器端桥接（URL ?map_id=&token=） =====================
    function authHeaders() {
      const h = {};
      if (bridgeToken) h.Authorization = "Bearer " + bridgeToken;
      return h;
    }

    async function loadFromServer() {
      const hint = document.getElementById("dropHint");
      if (!bridgeMapId || !bridgeToken) {
        hint.innerHTML = "缺少 map_id 或 token，请从导航页点击「编辑」打开本页";
        return;
      }
      document.getElementById("stMapId").textContent = bridgeMapId;
      hint.innerHTML = "正在从机器端加载地图…";
      try {
        // 一次拉取 map_2d.pgm + map_2d.yaml
        const res = await fetch(
          "/api/v1/nav/maps/" + encodeURIComponent(bridgeMapId) + "/info",
          { headers: authHeaders() }
        );
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.success === false) {
          throw new Error(data.error || ("HTTP " + res.status));
        }
        if (!data.pgm_base64) {
          throw new Error("响应缺少 pgm_base64");
        }
        // base64 → ArrayBuffer，再走既有 PGM 解析
        const bin = atob(data.pgm_base64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        loadPgmBuffer(bytes.buffer, (data.pgm_name || "map_2d.pgm"));
        if (typeof data.yaml === "string" && data.yaml.length) {
          parseYamlMeta(data.yaml);
        }
      } catch (err) {
        hint.innerHTML = "加载失败: " + err.message;
        alert("从机器端加载地图失败: " + err.message);
      }
    }

    async function saveToServer() {
      if (!bridgeMapId || !bridgeToken || !pix) {
        alert("当前无法保存：未接入机器端地图或尚未加载栅格");
        return;
      }
      const btn = document.getElementById("btnSaveServer");
      btn.disabled = true;
      try {
        const body = serializePGM();
        const res = await fetch(
          "/api/v1/nav/maps/" + encodeURIComponent(bridgeMapId) + "/pgm",
          {
            method: "PUT",
            headers: {
              ...authHeaders(),
              "Content-Type": "image/x-portable-graymap"
            },
            body
          }
        );
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.success === false) {
          throw new Error(data.error || ("HTTP " + res.status));
        }
        if (data.reload_sent) {
          alert("地图已保存，并已请求状态机重新加载当前地图");
        } else if (data.reload_error) {
          alert("地图已保存，但重新加载请求失败: " + data.reload_error);
        } else {
          alert("地图已保存到机器端");
        }
      } catch (err) {
        alert("保存失败: " + err.message);
      } finally {
        btn.disabled = !bridgeMapId || !pix;
      }
    }

    (function initBridgeFromUrl() {
      const qs = new URLSearchParams(location.search);
      bridgeMapId = qs.get("map_id") || "";
      bridgeToken = qs.get("token") || "";
      // 用完后从地址栏去掉 token，避免留在历史记录
      if (bridgeToken) {
        qs.delete("token");
        const next = qs.toString();
        history.replaceState(
          null,
          "",
          location.pathname + (next ? "?" + next : "") + location.hash
        );
      }
    })();

    // ===================== 导出（本机下载，不覆盖机器端） =====================
    function download(blob, name) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    document.getElementById("btnSave").onclick = () =>
      download(new Blob([serializePGM()], { type: "image/x-portable-graymap" }), fileName + ".pgm");
    document.getElementById("btnSaveYaml").onclick = () =>
      download(new Blob([serializeYaml()], { type: "text/yaml" }), fileName + ".yaml");
    document.getElementById("btnSaveServer").onclick = () => { saveToServer(); };

    // ===================== 工具栏 =====================
    document.querySelectorAll(".tool").forEach(b => b.onclick = () => {
      tool = b.dataset.tool;
      document.querySelectorAll(".tool").forEach(x => x.classList.toggle("active", x === b));
    });
    document.querySelectorAll(".valbtn").forEach(b => b.onclick = () => {
      paintVal = +b.dataset.val;
      document.querySelectorAll(".valbtn").forEach(x => x.classList.toggle("active", x === b));
    });
    document.getElementById("brushSize").onchange = e =>
      brushSize = Math.max(1, Math.min(100, +e.target.value || 3));
    document.getElementById("btnUndo").onclick = undo;
    document.getElementById("btnRedo").onclick = redo;
    document.getElementById("btnTris").onclick = trisState;
    document.getElementById("btnFit").onclick = fitView;
    document.getElementById("showGrid").onchange = e => { showGrid = e.target.checked; render(); };

    window.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
      if ((e.ctrlKey || e.metaKey) && (e.key === "y" || (e.key === "z" && e.shiftKey))) { e.preventDefault(); redo(); }
      if (e.target.tagName === "INPUT") return;
      // Esc: 取消多边形草稿; Delete: 删除选中区域
      if (e.key === "Escape" && polyDraft.length) { polyDraft = []; render(); return; }
      if ((e.key === "Delete" || e.key === "Backspace") && selZoneId != null) { deleteZone(selZoneId); return; }
      const k = e.key.toLowerCase();
      if (k === "b") document.querySelector('[data-tool="brush"]').click();
      if (k === "v") document.querySelector('[data-tool="zselect"]').click();
      if (k === "l") document.querySelector('[data-tool="line"]').click();
      if (k === "r") document.querySelector('[data-tool="rect"]').click();
      if (k === "f") document.querySelector('[data-tool="fill"]').click();
      if (k === "i") document.querySelector('[data-tool="picker"]').click();
      if (k === "1") document.querySelector('[data-val="0"]').click();
      if (k === "2") document.querySelector('[data-val="254"]').click();
      if (k === "3") document.querySelector('[data-val="205"]').click();
    });

    // ===================== 状态栏 =====================
    function updateStatus() {
      document.getElementById("stSize").textContent = pix ? `${W} × ${H}` : "-";
      document.getElementById("stZoom").textContent = pix ? scale.toFixed(1) + "×" : "-";
      document.getElementById("stRes").textContent = resolution + " m/格";
      document.getElementById("stOrigin").textContent = `[${origin.join(", ")}]`;
      if (pix && hoverCell && hoverCell.x >= 0 && hoverCell.y >= 0 && hoverCell.x < W && hoverCell.y < H) {
        const v = pix[hoverCell.y * W + hoverCell.x];
        document.getElementById("stCell").textContent = `(${hoverCell.x}, ${hoverCell.y})`;
        // PGM 第0行=图像顶部, ROS 原点在图像左下角
        const px = origin[0] + hoverCell.x * resolution;
        const py = origin[1] + (H - 1 - hoverCell.y) * resolution;
        document.getElementById("stPhys").textContent = `(${px.toFixed(3)}, ${py.toFixed(3)}) m`;
        const tag = v === 0 ? "障碍" : v === 254 ? "空闲" : v === 205 ? "未知" : "过渡";
        document.getElementById("stVal").textContent = `${v} (${tag})`;
      } else {
        document.getElementById("stCell").textContent = "-";
        document.getElementById("stPhys").textContent = "-";
        document.getElementById("stVal").textContent = "-";
      }
    }
    render();
    // 从导航页带 map_id 进入时自动拉取 PGM + YAML
    loadFromServer();
  </script>
</body>

</html>
