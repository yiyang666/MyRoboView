name: ROS2 C++ baseline
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: humble
            image: ros:humble-ros-base-jammy
          - distro: jazzy
            image: ros:jazzy-ros-base-noble
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 15
    env:
      ROS_DISTRO: ${{ matrix.distro }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y build-essential cmake python3-colcon-common-extensions libboost-system-dev libjsoncpp-dev ros-$ROS_DISTRO-sensor-msgs ros-$ROS_DISTRO-nav-msgs ros-$ROS_DISTRO-rosidl-default-generators ros-$ROS_DISTRO-rosidl-typesupport-introspection-cpp
      - name: Build C++ nodes and custom interfaces
        shell: bash
        run: ./scripts/build.sh
      - name: Unit and real DDS integration tests
        shell: bash
        run: ./scripts/test.sh
