name: ROS2 C++ baseline
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base-noble
    timeout-minutes: 15
    env:
      ROS_DISTRO: jazzy
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y build-essential cmake python3-colcon-common-extensions libdrogon-dev libjsoncpp-dev ros-$ROS_DISTRO-sensor-msgs ros-$ROS_DISTRO-nav-msgs ros-$ROS_DISTRO-rosidl-default-generators ros-$ROS_DISTRO-rosidl-typesupport-introspection-cpp
      - name: Build C++ nodes and custom interfaces
        shell: bash
        run: ./scripts/build.sh
      - name: Unit and real DDS integration tests
        shell: bash
        run: ./scripts/test.sh
