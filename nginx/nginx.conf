# 部署环境下推荐使用nginx代理访问前端，避免跨域问题
# 以下是参考配置
server {
    listen 80;
    server_name _;  # NX 机器的 IP 地址,下划线表示匹配所有IP

    # 前端静态文件
    root /var/www/robot-monitor;
    index index.html;

    # 前端路由支持（React Router）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 机器人模型 mesh 资源：首次加载限速，后续强缓存，避免大文件传输影响实时进程
    location ~* \.(stl|dae|obj|glb)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        limit_rate 5m;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端
    # 若只监听IPV4,用127.0.0.1 而避免使用 http://localtion:8080
    location /api/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket 代理
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 日志
    access_log /var/log/nginx/robot-monitor-access.log;
    error_log /var/log/nginx/robot-monitor-error.log;
   
    # 启用Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

}

